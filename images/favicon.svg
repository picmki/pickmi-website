<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#334155" stroke-width="4"/>
  <!-- Location Pin & Motion Trail Icon -->
  <g filter="url(#glow)">
    <path d="M 256 100 C 180 100 120 160 120 236 C 120 310 190 370 230 405 C 245 418 267 418 282 405 C 322 370 392 310 392 236 C 392 160 332 100 256 100 Z M 256 290 C 226 290 202 266 202 236 C 202 206 226 182 256 182 C 286 182 310 206 310 236 C 310 266 286 290 256 290 Z" fill="url(#iconGrad)"/>
    <path d="M 120 340 C 90 310 80 260 100 220" fill="none" stroke="#06b6d4" stroke-width="20" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
