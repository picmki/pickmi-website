<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pickmi Cabs in Pune</title>
  <meta http-equiv="refresh" content="0;url=city.html?city=pune">
  <script>window.location.replace('city.html?city=pune');</script>

  <style>
    @keyframes headerFadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .header.sticky {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      z-index: 10000 !important;
      background: #ffffff !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
      animation: headerFadeIn 0.3s ease-out forwards !important;
    }
  </style>

</head>
<body>  <script src="app.js?v=99"></script>

  <!-- SPLIT-SCREEN LOGIN MODAL -->
  <div class="login-modal-overlay" id="splitLoginModalOverlay">
    <div class="login-modal" id="splitLoginModal">
      <button class="login-modal-close" id="splitLoginModalClose">&times;</button>
      <div class="login-modal-left" style="background-image: url('images/hero-bg.jpg');">
      </div>
      <div class="login-modal-right">
        <h2 class="login-title">Welcome to Pickmi</h2>
        <p class="login-subtitle">Sign in or create an account to manage your rides and preferences.</p>
        
        <form class="login-form" id="splitLoginForm">
          <div class="phone-input-group">
            <div class="phone-flag">
              <img src="https://flagcdn.com/w20/in.png" alt="IN">
            </div>
            <input type="tel" placeholder="Enter Mobile Number" class="login-input phone-input" pattern="[0-9]{10}" maxlength="10" required>
          </div>
          
          <button type="submit" class="login-submit-btn">Continue</button>
        </form>
        
        <p class="login-footer-text">By subscribing you agree with the <a href="#">terms and conditions</a> of Pickmi</p>
      </div>
    </div>
  </div>

  <!-- Supabase JS Client Integration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</body>
</html>
